<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="#f6f8f4"/><rect width="100%" height="8" fill="#247567"/><text x="42" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#247567" text-anchor="start">GML  /  RESEARCH FIGURE</text><text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="32" fill="#223c47" text-anchor="start">One telemetry pipeline. Three measured-data workspaces.</text><text x="42" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#587078" text-anchor="start">The inverter shares the application shell, but uses its own simulation inputs.</text><rect x="45" y="205" width="240" height="80" rx="10" fill="white" stroke="#cbdad4"/><text x="165.0" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">IAMMETER meters</text><text x="165.0" y="267.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Three-phase measurements</text><rect x="335" y="205" width="240" height="80" rx="10" fill="white" stroke="#cbdad4"/><text x="455.0" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">MQTT collector</text><text x="455.0" y="267.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Validate + normalize</text><rect x="625" y="205" width="240" height="80" rx="10" fill="white" stroke="#cbdad4"/><text x="745.0" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">SQLite history</text><text x="745.0" y="267.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Private persistent storage</text><rect x="915" y="205" width="240" height="80" rx="10" fill="white" stroke="#cbdad4"/><text x="1035.0" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">GML API</text><text x="1035.0" y="267.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Public building aliases</text><path d="M285 245 L330 245" stroke="#2d7f9a" stroke-width="2.5" fill="none"/><polygon points="330,245 320.78939005997114,248.8941834230865 320.78939005997114,241.1058165769135" fill="#2d7f9a"/><path d="M575 245 L620 245" stroke="#2d7f9a" stroke-width="2.5" fill="none"/><polygon points="620,245 610.7893900599712,248.8941834230865 610.7893900599712,241.1058165769135" fill="#2d7f9a"/><path d="M865 245 L910 245" stroke="#2d7f9a" stroke-width="2.5" fill="none"/><polygon points="910,245 900.7893900599712,248.8941834230865 900.7893900599712,241.1058165769135" fill="#2d7f9a"/><rect x="70" y="450" width="205" height="105" rx="10" fill="white" stroke="#cbdad4"/><text x="172.5" y="495.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">Energy analytics</text><text x="172.5" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">All seven meter streams</text><rect x="360" y="450" width="205" height="105" rx="10" fill="white" stroke="#cbdad4"/><text x="462.5" y="495.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">Thermal sensitivity</text><text x="462.5" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Main transformer stream</text><rect x="650" y="450" width="205" height="105" rx="10" fill="white" stroke="#cbdad4"/><text x="752.5" y="495.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">Grid monitoring</text><text x="752.5" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Meter status + study network</text><rect x="940" y="450" width="205" height="105" rx="10" fill="white" stroke="#cbdad4"/><text x="1042.5" y="495.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#247567" text-anchor="middle">PV inverter</text><text x="1042.5" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#587078" text-anchor="middle">Independent simulation</text><path d="M1035 285 V350 H172 V442" stroke="#2d7f9a" fill="none" stroke-width="2"/><path d="M172 430 L172 447" stroke="#2d7f9a" stroke-width="2.5" fill="none"/><polygon points="172,447 168.1058165769135,437.78939005997114 175.8941834230865,437.78939005997114" fill="#2d7f9a"/><path d="M1035 285 V350 H462 V442" stroke="#2d7f9a" fill="none" stroke-width="2"/><path d="M462 430 L462 447" stroke="#2d7f9a" stroke-width="2.5" fill="none"/><polygon points="462,447 458.10581657691347,437.78939005997114 465.89418342308653,437.78939005997114" fill="#2d7f9a"/><path d="M1035 285 V350 H752 V442" stroke="#2d7f9a" fill="none" stroke-width="2"/><path d="M752 430 L752 447" stroke="#2d7f9a" stroke-width="2.5" fill="none"/><polygon points="752,447 748.1058165769135,437.78939005997114 755.8941834230865,437.78939005997114" fill="#2d7f9a"/><text x="940" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#587078" text-anchor="start">No live meter input</text><text x="42" y="675" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#587078" text-anchor="start">Documentation illustration. No live measurement or UI capture is implied.</text></svg>